name: Check HK Ticketing Availability

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 檢查票務狀態
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_tickets.py

      - name: 上傳除錯截圖與網路紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            latest_screenshot.png
            network_log.json
          retention-days: 3

      - name: 提交最新狀態
        run: |
          git config user.name "ticket-watcher-bot"
          git config user.email "actions@users.noreply.github.com"

          # 先取得 GitHub 上最新版本，避免 push 被拒絕
          git pull --rebase origin main

          git add status.txt

          if ! git diff --cached --quiet; then
            git commit -m "更新票務狀態 [skip ci]"
            git push origin main
          else
            echo "status.txt 沒有變化，不需要提交"
          fi
