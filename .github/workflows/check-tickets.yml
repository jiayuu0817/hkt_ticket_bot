name: Check HK Ticketing Availability

on:
  workflow_dispatch:
  schedule:
    - cron: "15,21,25,30,35,40,45,50,55,5,10,13 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 檢查票務狀態
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_tickets.py

      - name: 上傳除錯截圖與網路紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            latest_screenshot.png
            network_log.json
          retention-days: 3

      - name: 提交最新狀態
        run: |
          git config user.name "ticket-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.txt
          git diff --cached --quiet || git commit -m "更新票務狀態 [skip ci]"
          git push
